<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>สั่งซื้อสินค้า | Body Scent</title>
  <meta name="description" content="กรอกข้อมูลเพื่อสั่งซื้อสินค้า Body Scent">
  <link rel="stylesheet" href="style.css">
  <style>
    /* สไตล์เฉพาะหน้าสั่งซื้อ */
    .page-title { font-size: clamp(2rem, 5vw, 3rem); font-weight: 300; }
    .order-section { padding-top: var(--space-6); }
    .order-form { max-width: 560px; margin: 0 auto; }
    .order-form .field textarea { resize: vertical; min-height: 3.2rem; }
    .order-form .btn { width: 100%; margin-top: var(--space-3); }
    .order-hint { text-align: center; margin: var(--space-3) auto 0; font-size: 0.9rem; }
    /* ซ่อนลูกศรขึ้น-ลงของช่องตัวเลข */
    .order-form input[type="number"] { -moz-appearance: textfield; appearance: textfield; }
    .order-form input[type="number"]::-webkit-outer-spin-button,
    .order-form input[type="number"]::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
  </style>
</head>
<body>

  <header class="site-header">
    <div class="container">
      <a class="brand" href="index.html">Body Scent</a>
      <nav class="nav" aria-label="เมนูหลัก">
        <a href="index.html">หน้าแรก</a>
        <a href="product.html">สินค้า</a>
      </nav>
    </div>
  </header>

  <main>
    <section class="section order-section">
      <div class="container">
        <div class="section-head">
          <h1 class="page-title">สั่งซื้อสินค้า</h1>
          <span class="title-rule" aria-hidden="true"></span>
          <p>กรอกข้อมูลด้านล่าง เราจะติดต่อกลับเพื่อยืนยันคำสั่งซื้อ</p>
        </div>

        <form id="orderForm" class="order-form" autocomplete="on">
          <div class="field">
            <label for="customerName">ชื่อลูกค้า</label>
            <input type="text" id="customerName" name="customerName" autocomplete="name" required>
          </div>

          <div class="field">
            <label for="contact">เบอร์โทร / Line</label>
            <input type="text" id="contact" name="contact" autocomplete="tel" required>
          </div>

          <div class="field">
            <label for="items">รายการสินค้า</label>
            <textarea id="items" name="items" rows="2" required></textarea>
          </div>

          <div class="field">
            <label for="total">จำนวนเงินรวม (บาท)</label>
            <input type="number" id="total" name="total" min="0" step="any" inputmode="decimal" required>
          </div>

          <div class="field">
            <label for="note">หมายเหตุ (ถ้ามี)</label>
            <textarea id="note" name="note" rows="3"></textarea>
          </div>

          <button type="submit" class="btn btn--solid">ยืนยันสั่งซื้อ</button>
        </form>

        <p class="order-hint">ยังไม่ได้เลือกสินค้า? <a class="link-line" href="product.html">ดูสินค้าทั้งหมด</a></p>
      </div>
    </section>
  </main>

  <footer class="site-footer">
    <div class="container">
      <a class="brand" href="index.html">Body Scent</a>
      <p>น้ำหอมฉีดตัวและโรลออนสำหรับทุกมู้ด</p>
      <nav class="footer-links" aria-label="ลิงก์ท้ายเว็บ">
        <a href="index.html">หน้าแรก</a>
        <a href="product.html">สินค้าทั้งหมด</a>
      </nav>
      <div class="footer-bottom">&copy; 2026 Body Scent. สงวนลิขสิทธิ์</div>
    </div>
  </footer>

  <script src="script.js"></script>
</body>
</html>
