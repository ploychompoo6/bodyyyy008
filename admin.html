<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>รายการสั่งซื้อ | Body Scent</title>
  <meta name="robots" content="noindex, nofollow">
  <link rel="stylesheet" href="style.css">
  <style>
    /* สไตล์เฉพาะหน้า admin */
    .page-title { font-size: clamp(2rem, 5vw, 3rem); font-weight: 300; }
    .admin-section { padding-top: var(--space-6); }

    .table-wrap {
      overflow-x: auto;
      border: 1px solid var(--line-faint);
      border-radius: var(--radius);
      background: var(--white);
    }
    #ordersTable {
      width: 100%;
      min-width: 820px;
      border-collapse: collapse;
      font-size: 0.92rem;
      line-height: 1.6;
    }
    #ordersTable th,
    #ordersTable td {
      padding: var(--space-2) var(--space-3);
      text-align: left;
      vertical-align: top;
      border-bottom: 1px solid var(--line-faint);
    }
    #ordersTable thead th {
      font-family: var(--font-serif);
      font-size: 1.05rem;
      font-weight: 500;
      color: var(--ink);
      background: var(--cream);
      border-bottom: 1px solid var(--line);
      white-space: nowrap;
    }
    #ordersTable tbody td { color: var(--ink-soft); }
    #ordersTable tbody tr:last-child td { border-bottom: 0; }
    #ordersTable tbody tr:hover td { background: var(--cream); }
  </style>
</head>
<body>

  <header class="site-header">
    <div class="container">
      <a class="brand" href="index.html">Body Scent</a>
      <nav class="nav" aria-label="เมนูหลัก">
        <a href="index.html">หน้าแรก</a>
        <a href="product.html">สินค้า</a>
      </nav>
    </div>
  </header>

  <main>
    <section class="section admin-section">
      <div class="container">
        <div class="section-head">
          <h1 class="page-title">รายการสั่งซื้อ</h1>
          <span class="title-rule" aria-hidden="true"></span>
          <p>แสดงรายการล่าสุดก่อน</p>
        </div>

        <div class="table-wrap">
          <table id="ordersTable">
            <thead>
              <tr>
                <th scope="col">วันเวลา</th>
                <th scope="col">ชื่อลูกค้า</th>
                <th scope="col">เบอร์โทร/Line</th>
                <th scope="col">รายการสินค้า</th>
                <th scope="col">จำนวนเงินรวม</th>
                <th scope="col">หมายเหตุ</th>
              </tr>
            </thead>
            <tbody></tbody>
          </table>
        </div>
      </div>
    </section>
  </main>

  <footer class="site-footer">
    <div class="container">
      <a class="brand" href="index.html">Body Scent</a>
      <div class="footer-bottom">&copy; 2026 Body Scent</div>
    </div>
  </footer>

  <script src="script.js"></script>
</body>
</html>
